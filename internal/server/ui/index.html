<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AHP Server — Agent Home Protocol</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-alt: #334155;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --warn: #eab308;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--panel-alt);
      color: var(--muted);
      font-weight: 500;
    }
    .badge.ok { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge.warn { background: rgba(234,179,8,0.15); color: #facc15; }
    .badge.err { background: rgba(239,68,68,0.15); color: #f87171; }
    nav {
      display: flex;
      gap: 0.5rem;
    }
    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      padding: 0.45rem 0.9rem;
      border-radius: 0.4rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.35);
    }
    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 0.4rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn.secondary {
      background: var(--panel-alt);
      color: var(--text);
    }
    main {
      flex: 1;
      overflow: hidden;
      display: flex;
    }
    .view {
      display: none;
      width: 100%;
      height: 100%;
    }
    .view.active {
      display: flex;
    }
    /* Sessions layout */
    .sidebar {
      width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.75rem;
      overflow-y: auto;
    }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .messages {
      flex: 1;
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg {
      max-width: 80%;
      padding: 0.8rem 1rem;
      border-radius: 0.6rem;
      line-height: 1.45;
      white-space: pre-wrap;
      font-size: 0.93rem;
    }
    .msg.user {
      align-self: flex-end;
      background: #0284c7;
      color: #fff;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
    }
    .msg.tool {
      align-self: flex-start;
      background: rgba(51, 65, 85, 0.5);
      border-left: 3px solid var(--accent);
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--muted);
      max-width: 90%;
    }
    .composer {
      padding: 0.9rem 1.25rem;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.6rem;
    }
    input, select, textarea {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 0.75rem;
      border-radius: 0.4rem;
      font-size: 0.9rem;
      width: 100%;
    }
    .session-item {
      padding: 0.6rem 0.75rem;
      border-radius: 0.4rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
    }
    .session-item.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }
    .grid-view {
      padding: 1.5rem;
      overflow-y: auto;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1.25rem;
      align-content: start;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .card h3 { margin: 0; font-size: 1.05rem; }
    pre {
      background: var(--bg);
      padding: 0.75rem;
      border-radius: 0.4rem;
      overflow-x: auto;
      font-size: 0.8rem;
      margin: 0;
      border: 1px solid var(--border);
    }
    .split-view {
      display: grid;
      grid-template-columns: 400px 1fr;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .pane {
      padding: 1.25rem;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      display: block;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>AHP Server</span>
      <span id="scanBadge" class="badge">Loading...</span>
    </div>
    <nav>
      <button class="tab-btn active" onclick="switchTab('sessions', this)">End-User Sessions</button>
      <button class="tab-btn" onclick="switchTab('workflows', this)">Automated Workflows</button>
      <button class="tab-btn" onclick="switchTab('personas', this)">Personas (<span id="personaCount">0</span>)</button>
    </nav>
    <div>
      <button class="btn secondary" onclick="reloadPersonas()">Rescan Folder</button>
    </div>
  </header>

  <main>
    <!-- 1. End-User Sessions View -->
    <section id="view-sessions" class="view active">
      <div class="sidebar">
        <div>
          <label>Persona</label>
          <select id="sessionPersonaSelect"></select>
        </div>
        <div>
          <label>Session Title (optional)</label>
          <input id="sessionTitleInput" placeholder="New conversation..." />
        </div>
        <button class="btn" onclick="createNewSession()">+ New Session</button>
        <hr style="border-color: var(--border); width: 100%;" />
        <label>Recent Sessions</label>
        <div id="sessionList" style="display:flex;flex-direction:column;gap:0.4rem;"></div>
      </div>
      <div class="chat-container">
        <div id="chatMessages" class="messages">
          <div style="color:var(--muted);margin:auto;">Select or create a session to begin chatting with an agent persona.</div>
        </div>
        <div id="chatStatus" style="padding:0 1.25rem;font-size:0.8rem;color:var(--accent);min-height:1.2rem;"></div>
        <div class="composer">
          <input id="chatInput" placeholder="Send a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
          <button class="btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </section>

    <!-- 2. Automated Workflows View -->
    <section id="view-workflows" class="view">
      <div class="split-view">
        <div class="pane">
          <h3 style="margin:0;">Trigger Automated Workflow</h3>
          <div>
            <label>Persona</label>
            <select id="wfPersonaSelect" onchange="updateCurlPreview()"></select>
          </div>
          <div>
            <label>Workflow Name</label>
            <input id="wfNameInput" value="webhook-job" oninput="updateCurlPreview()" />
          </div>
          <div>
            <label>Prompt / Task Instruction</label>
            <textarea id="wfPromptInput" rows="4" placeholder="Analyze incoming event payload..." oninput="updateCurlPreview()">Summarize the incoming alert payload and run diagnostic checks.</textarea>
          </div>
          <div>
            <label>Input Payload (JSON)</label>
            <textarea id="wfPayloadInput" rows="3" oninput="updateCurlPreview()">{"service": "payments-api", "severity": "warning"}</textarea>
          </div>
          <div style="display:flex;gap:0.5rem;">
            <button class="btn" onclick="triggerWorkflow(false)">Run Synchronously</button>
            <button class="btn secondary" onclick="triggerWorkflow(true)">Trigger Async</button>
          </div>
          <div>
            <label>External Server Webhook cURL</label>
            <pre id="curlPreview"></pre>
          </div>
        </div>
        <div class="pane" style="border-right:none;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <h3 style="margin:0;">Workflow Run History</h3>
            <button class="btn secondary" onclick="loadWorkflowRuns()">Refresh</button>
          </div>
          <div id="workflowRunsList" style="display:flex;flex-direction:column;gap:0.75rem;"></div>
        </div>
      </div>
    </section>

    <!-- 3. Personas View -->
    <section id="view-personas" class="view">
      <div id="personasGrid" class="grid-view"></div>
    </section>
  </main>

  <script>
    let personas = [];
    let currentSessionId = null;

    function switchTab(name, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      btn.classList.add('active');
      if (name === 'workflows') {
        updateCurlPreview();
        loadWorkflowRuns();
      }
    }

    async function fetchPersonas() {
      const res = await fetch('/api/v1/personas');
      const data = await res.json();
      personas = data.personas || [];
      document.getElementById('personaCount').textContent = personas.length;
      const st = data.status || {};
      const rev = st.git_revision ? ` | git: ${st.git_revision}` : '';
      const scanBadge = document.getElementById('scanBadge');
      scanBadge.textContent = `Dir: ${st.directory || './personas'} (every ${st.scan_interval || '30s'}${rev})`;
      scanBadge.className = (st.scan_errors && st.scan_errors.length) ? 'badge warn' : 'badge ok';

      const sel1 = document.getElementById('sessionPersonaSelect');
      const sel2 = document.getElementById('wfPersonaSelect');
      sel1.innerHTML = '';
      sel2.innerHTML = '';
      personas.forEach(p => {
        sel1.innerHTML += `<option value="${p.id}">${p.name} (${p.id})</option>`;
        sel2.innerHTML += `<option value="${p.id}">${p.name} (${p.id})</option>`;
      });

      renderPersonasGrid();
      updateCurlPreview();
    }

    function renderPersonasGrid() {
      const grid = document.getElementById('personasGrid');
      if (!personas.length) {
        grid.innerHTML = `<div class="card"><h3>No personas found</h3><p style="color:var(--muted)">Add a subfolder with <code>config.yaml</code> and <code>prompt.md</code> inside your personas folder.</p></div>`;
        return;
      }
      grid.innerHTML = personas.map(p => {
        const skillsHtml = (p.skills || []).map(s => `<span class="badge ok">${s.name}</span>`).join(' ') || '<span class="badge">none</span>';
        const mcpHtml = (p.mcp_servers || []).map(m => `<div style="font-size:0.8rem;">• <b>${m.name}</b>: <code>${m.url}</code> <span class="badge ${m.token_resolved ? 'ok' : ''}">${m.token_key || 'no-auth'}</span></div>`).join('') || '<div style="font-size:0.8rem;color:var(--muted)">None configured</div>';
        return `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <h3>${p.name}</h3>
              <span class="badge">${p.id}</span>
            </div>
            <div style="font-size:0.85rem;color:var(--muted);">${p.description || ''}</div>
            <div>
              <label>LLM Endpoint & Model</label>
              <div style="font-size:0.82rem;"><code>${p.llm.endpoint}</code> — <b>${p.llm.model}</b></div>
              <div style="font-size:0.78rem;margin-top:0.2rem;">Token key: <code>${p.llm.token_key || 'none'}</code>
                <span class="badge ${p.llm_token_resolved ? 'ok' : 'warn'}">${p.llm_token_resolved ? 'resolved' : 'missing/unset'}</span>
              </div>
            </div>
            <div>
              <label>MCP Servers</label>
              ${mcpHtml}
            </div>
            <div>
              <label>Skills</label>
              <div style="display:flex;gap:0.35rem;flex-wrap:wrap;">${skillsHtml}</div>
            </div>
            <div>
              <label>Base Instructions</label>
              <pre>${escapeHtml(p.instructions || '')}</pre>
            </div>
          </div>
        `;
      }).join('');
    }

    async function reloadPersonas() {
      await fetch('/api/v1/personas/reload', { method: 'POST' });
      await fetchPersonas();
    }

    async function loadSessions() {
      const res = await fetch('/api/v1/sessions');
      const data = await res.json();
      const list = document.getElementById('sessionList');
      const items = data.sessions || [];
      list.innerHTML = items.map(s => `
        <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" onclick="selectSession('${s.id}')">
          <div>
            <div style="font-weight:600;">${escapeHtml(s.title || s.id.slice(0,8))}</div>
            <div style="font-size:0.75rem;color:var(--muted);">${s.persona_id}</div>
          </div>
        </div>
      `).join('');
    }

    async function createNewSession() {
      const personaId = document.getElementById('sessionPersonaSelect').value;
      const title = document.getElementById('sessionTitleInput').value.trim();
      if (!personaId) return;
      const res = await fetch('/api/v1/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona_id: personaId, title })
      });
      const sess = await res.json();
      document.getElementById('sessionTitleInput').value = '';
      currentSessionId = sess.id;
      await loadSessions();
      await selectSession(sess.id);
    }

    async function selectSession(id) {
      currentSessionId = id;
      await loadSessions();
      const res = await fetch(`/api/v1/sessions/${id}`);
      const sess = await res.json();
      renderMessages(sess.messages || []);
    }

    function renderMessages(messages) {
      const box = document.getElementById('chatMessages');
      if (!messages.length) {
        box.innerHTML = `<div style="color:var(--muted);margin:auto;">Session created. Send a message below!</div>`;
        return;
      }
      box.innerHTML = messages.map(m => {
        if (m.role === 'tool') {
          return `<div class="msg tool">Tool Result (${m.tool_call_id}):\n${escapeHtml(m.content)}</div>`;
        }
        let tcInfo = '';
        if (m.tool_calls && m.tool_calls.length) {
          tcInfo = m.tool_calls.map(tc => `<div>⚡ Tool Call: <b>${escapeHtml(tc.function.name)}</b>(${escapeHtml(tc.function.arguments)})</div>`).join('');
        }
        return `<div class="msg ${m.role}">${tcInfo}${escapeHtml(m.content || '')}</div>`;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const content = input.value.trim();
      if (!content) return;
      if (!currentSessionId) {
        await createNewSession();
      }
      input.value = '';
      const box = document.getElementById('chatMessages');
      box.innerHTML += `<div class="msg user">${escapeHtml(content)}</div>`;
      box.scrollTop = box.scrollHeight;

      const statusEl = document.getElementById('chatStatus');
      statusEl.textContent = 'Agent thinking...';

      const res = await fetch(`/api/v1/sessions/${currentSessionId}/messages?stream=true`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
        body: JSON.stringify({ content })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (line.startsWith('data:')) {
            try {
              const ev = JSON.parse(line.slice(5).trim());
              if (ev.type === 'status') statusEl.textContent = ev.content;
              if (ev.type === 'tool_call') statusEl.textContent = `Calling tool ${ev.name}...`;
              if (ev.type === 'error') statusEl.textContent = `Error: ${ev.content}`;
            } catch (_) {}
          }
        }
      }
      statusEl.textContent = '';
      await selectSession(currentSessionId);
    }

    function updateCurlPreview() {
      const personaId = document.getElementById('wfPersonaSelect').value || 'default-assistant';
      const wfName = document.getElementById('wfNameInput').value || 'webhook-job';
      const prompt = document.getElementById('wfPromptInput').value || '';
      let inputObj = {};
      try { inputObj = JSON.parse(document.getElementById('wfPayloadInput').value || '{}'); } catch (_) {}
      const body = JSON.stringify({
        persona_id: personaId,
        workflow_name: wfName,
        prompt: prompt,
        input: inputObj,
        async: true
      }, null, 2);
      document.getElementById('curlPreview').textContent =
        `curl -X POST ${location.origin}/api/v1/workflows/trigger \\\n  -H "Content-Type: application/json" \\\n  -d '${body}'`;
    }

    async function triggerWorkflow(asyncMode) {
      const personaId = document.getElementById('wfPersonaSelect').value;
      const wfName = document.getElementById('wfNameInput').value;
      const prompt = document.getElementById('wfPromptInput').value;
      let inputObj = {};
      try { inputObj = JSON.parse(document.getElementById('wfPayloadInput').value || '{}'); } catch (_) {}
      await fetch('/api/v1/workflows/trigger', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          persona_id: personaId,
          workflow_name: wfName,
          prompt: prompt,
          input: inputObj,
          async: asyncMode
        })
      });
      await loadWorkflowRuns();
    }

    async function loadWorkflowRuns() {
      const res = await fetch('/api/v1/workflows/runs');
      const data = await res.json();
      const runs = data.runs || [];
      const container = document.getElementById('workflowRunsList');
      if (!runs.length) {
        container.innerHTML = `<div style="color:var(--muted);">No workflow runs triggered yet.</div>`;
        return;
      }
      container.innerHTML = runs.map(r => {
        const badgeClass = r.status === 'completed' ? 'ok' : (r.status === 'failed' ? 'err' : 'warn');
        const stepsHtml = (r.steps || []).map(st => `<div style="font-size:0.78rem;color:var(--muted);">[${st.type}] <b>${escapeHtml(st.name || '')}</b> ${escapeHtml(st.output || st.input || '')}</div>`).join('');
        return `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div><b>${escapeHtml(r.workflow_name || 'workflow')}</b> <span class="badge">${r.persona_id}</span></div>
              <span class="badge ${badgeClass}">${r.status}</span>
            </div>
            <div style="font-size:0.82rem;color:var(--muted);">Prompt: ${escapeHtml(r.prompt)}</div>
            ${stepsHtml ? `<div><label>Execution Steps</label>${stepsHtml}</div>` : ''}
            ${r.output ? `<div><label>Output</label><pre>${escapeHtml(r.output)}</pre></div>` : ''}
            ${r.error ? `<div style="color:#f87171;font-size:0.82rem;">Error: ${escapeHtml(r.error)}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    fetchPersonas().then(loadSessions);
  </script>
</body>
</html>
